<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planet Jumping — Immersive Space Portal Experience</title>
  <style>
    /* 2. FONTS */
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text'), local('SF Pro'), local('SFProText-Regular'), local('SFPro-Regular');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('SFProText-Bold'), local('SFPro-Bold');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Thin';
      src: local('SF Pro Thin'), local('SFPro-Thin'), local('SF Pro Text Ultralight');
      font-weight: 100;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Aalto';
      src: local('Aalto'), local('Aalto-Regular'), local('AaltoDisplay');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
      --title-tx: -32px;
    }

    /* 5. LAYOUT CSS */
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090807;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body, button, a, .portal {
      cursor: none !important;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #0a0908;
    }
    .backgrounds {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
      pointer-events: none;
    }
    .background.is-visible {
      opacity: 1;
    }
    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, .88) 100%);
      pointer-events: none;
    }
    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity .45s ease, filter .45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade {
      opacity: 1;
    }
    .experience.is-committing .background {
      transition: none !important;
    }

    /* HEADER */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255, 255, 255, .45);
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 19px;
      border-radius: 999px;
      line-height: 1;
      font-size: 15px;
      transition: background .2s ease, color .2s ease;
    }
    .nav a.active {
      background: #fff;
      color: #000;
    }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    /* SIDEBAR */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: rgba(255, 255, 255, .68);
      letter-spacing: .02em;
    }
    .planet-item.active {
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
      color: #fff;
    }
    .planet-item.active:before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    /* PORTAL */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
      letter-spacing: .02em;
    }
    .portal-heading strong {
      font-size: 18px;
      margin-left: 8px;
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320 / 350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
      outline: none;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* CONTENT */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .planet-content h1 {
      font-family: Aalto, 'Arial Narrow', sans-serif;
      font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400;
      line-height: .72;
      margin: 0 0 -.04em;
      letter-spacing: 0;
      transform: translateX(var(--title-tx, -32px));
      opacity: 0;
      text-transform: uppercase;
    }
    .planet-content dl {
      width: min(447px, 34vw);
      margin: 0;
      font-size: 16px;
    }
    .fact {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .48);
      opacity: 0;
      line-height: 1.35;
    }
    .fact:last-child {
      border-bottom: 0;
    }
    .fact dt {
      font-weight: 700;
      color: #fff;
    }
    .fact dd {
      margin: 0;
      color: rgba(255, 255, 255, .88);
    }

    /* MISC */
    .transition-layer {
      display: none;
    }
    .scene-canvas {
      display: none;
    }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing:.14em;
      text-transform: uppercase;
      transition: opacity .2s ease;
      pointer-events: none;
    }
    .experience.is-loading .loading {
      opacity: .8;
    }

    /* 6. PRELOADER */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
      transition: opacity .8s ease;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
      transition: opacity .8s ease;
    }
    .preloader.is-background {
      z-index: 0;
      opacity: 0;
      pointer-events: none;
    }
    .preloader.is-background .preloader-shade {
      opacity: 0;
    }
    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 58px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(.16, 1, .3, 1),
                  top 2s cubic-bezier(.16, 1, .3, 1),
                  width 2s cubic-bezier(.16, 1, .3, 1),
                  height 2s cubic-bezier(.16, 1, .3, 1),
                  transform 2s cubic-bezier(.16, 1, .3, 1);
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 37px;
      height: 36px;
      transform: none;
    }
    .floating-logo.is-settled {
      z-index: 5;
    }
    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
    }
    .preloader-count.is-leaving {
      animation: preload-count-out .75s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes preload-count-out {
      to {
        opacity: 0;
        filter: blur(7px);
        transform: translate(-50%, -34px);
      }
    }
    body:not(.preload-complete) .custom-cursor {
      opacity: 0 !important;
    }

    /* 9. CUSTOM CURSOR */
    .custom-cursor {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: 1px;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
      will-change: transform;
    }
    .custom-cursor.is-visible {
      opacity: 1;
    }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 12px;
      height: 12px;
      background: #fff;
    }
    .cursor-orbit {
      width: 36px;
      height: 36px;
      border: 1px solid #fff;
      background: rgba(255, 255, 255, .4);
      transition: transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.16);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 16px / 1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s ease, transform .3s cubic-bezier(.22, 1, .36, 1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 10. ENTRANCE / SWITCH ANIMATIONS */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list {
      opacity: 0;
      pointer-events: none;
    }
    .intro-ready .header {
      animation: reveal-down .9s cubic-bezier(.22, 1, .36, 1) .1s both;
    }
    .intro-ready .planet-list {
      animation: reveal-side .9s cubic-bezier(.22, 1, .36, 1) .65s both;
    }
    .content-revealing h1 {
      animation: title-rise 1.05s cubic-bezier(.16, 1, .3, 1) both;
    }
    .content-revealing .fact {
      animation: fact-rise .72s cubic-bezier(.22, 1, .36, 1) both;
    }
    .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1s; }

    .mask-revealing .portal-heading {
      animation: portal-caption .85s cubic-bezier(.22, 1, .36, 1) both;
    }
    .planet-list.is-switching .planet-item {
      animation: menu-row .58s cubic-bezier(.22, 1, .36, 1) both;
    }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .2s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
    .planet-list.is-switching .planet-item.active:before {
      animation: active-dot .55s cubic-bezier(.22, 1, .36, 1) .18s both;
    }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(var(--title-tx, -32px), 42px); }
      to { opacity: 1; filter: blur(0); transform: translate(var(--title-tx, -32px), 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: .35; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    /* 11. RESPONSIVE */
    @media (max-width: 900px) {
      .nav {
        display: none;
      }
      .portal-wrap {
        width: min(300px, 48vw);
      }
      .planet-content h1 {
        font-size: clamp(105px, 24vw, 190px);
      }
      .planet-content dl {
        width: 43vw;
      }
      .fact {
        grid-template-columns: 110px 1fr;
      }
      .planet-list {
        font-size: 14px;
      }
      .planet-item.active {
        font-size: 16px;
      }
    }
    @media (max-width: 640px) {
      :root {
        --title-tx: 0px;
      }
      .experience {
        min-height: 600px;
      }
      .planet-list {
        display: none;
      }
      .portal-wrap {
        top: 44%;
        width: min(260px, 66vw);
      }
      .planet-content {
        left: 18px;
        right: 18px;
        bottom: 18px;
        display: block;
      }
      .planet-content h1 {
        font-size: clamp(98px, 30vw, 160px);
        margin-bottom: clamp(8px, 2vh, 20px);
        transform: translateX(0);
      }
      .planet-content dl {
        width: 100%;
        font-size: 13px;
        line-height: 1.25;
      }
      .fact {
        grid-template-columns: 92px 1fr;
        padding: 5px 0;
      }
      .portal-heading {
        font-size: 14px;
      }
      .portal-heading strong {
        font-size: 16px;
      }
      .menu {
        height: 38px;
      }
      .portal {
        border-radius: 70px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: .01ms !important;
      }
      .portal {
        transform: none !important;
      }
    }
  </style>
</head>

      <video id="earth-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4" muted playsinline preload="auto"></video>
      <video id="venus-background" class="background" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4" muted playsinline preload="auto"></video>

  </main>

  <script>
    // 4. DATA MODEL
    const BASE = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
    const MARS_BG = `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`;
    const TO_EARTH = `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`;

    const LOGO = `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`;

    const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

    const states = {
      mars: {
        name: 'Mars',
        next: 'Earth',
        number: '[03]',
        portal: TO_EARTH,
        background: 'mars-background',
        facts: [

          ['Year:', 'One Martian year is equal to 687 Earth days.'],
          ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
          ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
        ]
      },
      earth: {
        name: 'Earth',
        next: 'Venus',
        number: '[02]',
        portal: TO_VENUS,
        background: 'earth-background',
        facts: [
          ['Distance:', '149.6 million km from the Sun.'],
          ['Year:', '365.25 Earth days.'],
          ['Temperature:', 'Average surface temperature around 15 °C.'],
          ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
        ]
      },
      venus: {
        name: 'Venus',
        next: 'Mercury',
        number: '[06]',
        image: MERCURY,
        background: 'venus-background',
        facts: [
          ['Distance:', '108.2 million km from the Sun.'],
          ['Year:', '225 Earth days.'],
          ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
          ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
        ]
      }
    };

    let current = 'mars';
    let busy = true;
    let hasRendered = false;

    // DOM references
    const experience = document.querySelector('.experience');
    const preloaderEl = document.getElementById('preloader');
    const preloaderVideo = document.getElementById('preloader-video');
    const preloaderCount = document.getElementById('preloader-count');
    const preloaderValue = document.getElementById('preloader-value');
    const floatingLogo = document.getElementById('floating-logo');
    const sceneCanvas = document.getElementById('scene-canvas');
    const sceneCtx = sceneCanvas.getContext('2d');
    const portalCanvas = document.getElementById('portal-canvas');
    const portalCtx = portalCanvas.getContext('2d');
    const portalBtn = document.getElementById('portal');
    const portalVideo = document.getElementById('portal-video');
    const portalImage = document.getElementById('portal-image');
    const transitionVideo = document.getElementById('transition-video');
    const planetTitle = document.getElementById('planet-title');
    const nextNumber = document.getElementById('next-number');
    const nextName = document.getElementById('next-name');
    const factsDl = document.getElementById('facts');
    const planetList = document.querySelector('.planet-list');
    const customCursor = document.querySelector('.custom-cursor');

    // 7. THE PORTAL & 3D TILT STATE
    let targetX = 0;
    let targetY = 0;
    let rotX = 0;
    let rotY = 0;
    let lastFrameTime = performance.now();

    let expansion = 0; // 0..1
    let maskScale = 0; // 0..1
    let canvasOpacity = 1;
    let transitionActive = false;
    let hasFrozenScene = false;

    // 8. EASING & VALUE ANIMATION
    // easeInOutCubic: t < .5 ? 4t³ : 1 - Math.pow(-2t + 2, 3) / 2
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateValue(setter, duration) {
      return new Promise(resolve => {
        const startTime = performance.now();
        function frame(now) {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          setter(easeInOutCubic(progress));
          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            setter(1);
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    // 4. RENDER
    function render() {
      const state = states[current];
      experience.setAttribute('data-planet', current);
      planetTitle.textContent = state.name.toUpperCase();
      nextName.textContent = state.next;
      nextNumber.textContent = state.number;
      portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

      // Facts
      factsDl.innerHTML = state.facts
        .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
        .join('');

      // Planet list
      planetList.innerHTML = planets
        .map(p => {
          const activeClass = p.toLowerCase() === current.toLowerCase() ? ' active' : '';
          return `<span class="planet-item${activeClass}">${p}</span>`;
        })
        .join('');

      // Retrigger .is-switching on every re-render after the first
      if (hasRendered) {
        planetList.classList.remove('is-switching');
        void planetList.offsetWidth;
        planetList.classList.add('is-switching');
      }
      hasRendered = true;

      // Toggle .is-visible on matching background video
      document.querySelectorAll('.background').forEach(v => {
        const isMatch = v.id === state.background;
        v.classList.toggle('is-visible', isMatch);
        if (isMatch) {
          v.loop = true;
          if (document.body.classList.contains('preload-complete')) {
            v.play().catch(() => {});
          }
        } else {
          v.pause();
          v.currentTime = 0;
        }
      });

      // Show/hide portal image vs video
      if (state.image) {
        portalImage.style.display = 'block';
        portalVideo.style.display = 'none';
        portalVideo.pause();
      } else {
        portalImage.style.display = 'none';
        portalVideo.style.display = 'block';
        if (portalVideo.getAttribute('src') !== state.portal) {
          portalVideo.src = state.portal;
          portalVideo.load();
        }
        portalVideo.loop = true;
        if (document.body.classList.contains('preload-complete')) {
          portalVideo.play().catch(() => {});
        }
      }
    }

    // REVEAL RE-TRIGGERS
    function revealMask() {
      experience.classList.remove('mask-revealing');
      void experience.offsetWidth;
      experience.classList.add('mask-revealing');
      maskScale = 0;
      return animateValue(v => { maskScale = v; }, 1050);
    }

    function revealPlanetContent() {
      experience.classList.remove('content-revealing');
      void experience.offsetWidth;
      experience.classList.add('content-revealing');
    }

    // 7. CANVAS & COVER DRAWING
    function resizeCanvas() {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      const w = window.innerWidth;
      const h = window.innerHeight;

      portalCanvas.width = w * d;
      portalCanvas.height = h * d;
      portalCanvas.style.width = w + 'px';
      portalCanvas.style.height = h + 'px';
      portalCtx.setTransform(d, 0, 0, d, 0, 0);

      if (!hasFrozenScene) {
        sceneCanvas.width = w * d;
        sceneCanvas.height = h * d;
        sceneCanvas.style.width = w + 'px';
        sceneCanvas.style.height = h + 'px';
        sceneCtx.setTransform(d, 0, 0, d, 0, 0);
      }
    }

    function drawCover(media, targetCtx = portalCtx) {
      if (!media) return;
      const mw = media.videoWidth || media.naturalWidth || media.width || 0;
      const mh = media.videoHeight || media.naturalHeight || media.height || 0;
      if (mw <= 0 || mh <= 0) return;
      const s = Math.max(window.innerWidth / mw, window.innerHeight / mh);
      const dw = mw * s;
      const dh = mh * s;
      const dx = (window.innerWidth - dw) / 2;
      const dy = (window.innerHeight - dh) / 2;
      targetCtx.drawImage(media, dx, dy, dw, dh);
    }

    function drawShade(targetCtx = portalCtx) {
      const y0 = window.innerHeight * 0.52;
      const y1 = window.innerHeight;
      const grad = targetCtx.createLinearGradient(0, y0, 0, y1);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, 'rgba(0,0,0,0.88)');
      targetCtx.fillStyle = grad;
      targetCtx.fillRect(0, y0, window.innerWidth, y1 - y0);
    }

    // Rounded-rect point sampling (~44 points)
    function getRoundedRectPoints(w, h, r) {
      const maxR = Math.min(w / 2, h / 2);
      const cr = Math.max(0, Math.min(r, maxR));
      const points = [];
      const corners = [
        [ w / 2 - cr, -h / 2 + cr, -Math.PI / 2, 0 ],
        [ w / 2 - cr,  h / 2 - cr, 0, Math.PI / 2 ],
        [-w / 2 + cr,  h / 2 - cr, Math.PI / 2, Math.PI ],
        [-w / 2 + cr, -h / 2 + cr, Math.PI, Math.PI * 1.5 ]
      ];
      const steps = 10;
      for (let c = 0; c < 4; c++) {
        const [cx, cy, a0, a1] = corners[c];
        for (let i = 0; i <= steps; i++) {
          const theta = a0 + (a1 - a0) * (i / steps);
          points.push({
            x: cx + cr * Math.cos(theta),
            y: cy + cr * Math.sin(theta)
          });
        }
      }
      return points;
    }

    // FRAME LOOP
    function draw(now) {
      const dt = Math.min(now - lastFrameTime, 40);
      lastFrameTime = now;

      // Pointer tilt lerping (dt clamped to 40ms)
      const lerp = Math.min(1, dt * 0.009);
      rotX += (targetX - rotX) * lerp;
      rotY += (targetY - rotY) * lerp;

      portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      // Blit frozen scene if one exists
      if (hasFrozenScene) {
        portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
        drawShade(portalCtx);
      }

      const rect = portalBtn.getBoundingClientRect();
      const e = expansion;
      const rectCx = rect.left + rect.width / 2;
      const rectCy = rect.top + rect.height / 2;
      const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
      const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
      const baseW = rect.width + (window.innerWidth - rect.width) * e;
      const baseH = rect.height + (window.innerHeight - rect.height) * e;
      const scale = e ? 1 : maskScale;
      const w = baseW * scale;
      const h = baseH * scale;

      const baseR = parseFloat(window.getComputedStyle(portalBtn).borderRadius) || 90;
      const r = baseR * (1 - e) * scale;
      const rx = rotX * (1 - e);
      const ry = rotY * (1 - e);

      if (w > 1 && h > 1) {
        const points = getRoundedRectPoints(w, h, r);
        const ax = rx * Math.PI / 180;
        const ay = ry * Math.PI / 180;
        const cosAx = Math.cos(ax), sinAx = Math.sin(ax);
        const cosAy = Math.cos(ay), sinAy = Math.sin(ay);

        portalCtx.beginPath();
        for (let i = 0; i < points.length; i++) {
          const pt = points[i];
          const xx = pt.x * cosAy;
          const yy = pt.y * cosAx;
          const z = pt.x * sinAy - pt.y * sinAx;
          const p = 850 / (850 + z);
          const sx = cx + xx * p;
          const sy = cy + yy * p;
          if (i === 0) portalCtx.moveTo(sx, sy);
          else portalCtx.lineTo(sx, sy);
        }
        portalCtx.closePath();

        portalCtx.save();
        portalCtx.globalAlpha = canvasOpacity;
        portalCtx.clip();
        portalCtx.fillStyle = '#030303';
        portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const state = states[current];
        const media = transitionActive
          ? transitionVideo
          : (state.image ? portalImage : portalVideo);

        drawCover(media, portalCtx);

        if (transitionActive) {
          drawShade(portalCtx);
        }

        portalCtx.restore();
      }

      requestAnimationFrame(draw);
    }

    // 8. TRAVEL TRANSITION
    async function travel() {
      if (busy || current === 'venus') return;
      busy = true;
      targetX = 0;
      targetY = 0;

      const next = current === 'mars' ? 'earth' : 'venus';

      try {
        transitionVideo.src = states[current].portal;
        transitionVideo.load();
        experience.classList.add('is-loading');

        // Await canplaythrough or error or 1600ms timeout
        await new Promise(resolve => {
          let resolved = false;
          const finishWait = () => {
            if (!resolved) {
              resolved = true;
              transitionVideo.removeEventListener('canplaythrough', finishWait);
              transitionVideo.removeEventListener('error', finishWait);
              clearTimeout(timer);
              resolve();
            }
          };
          const timer = setTimeout(finishWait, 1600);
          transitionVideo.addEventListener('canplaythrough', finishWait, { once: true });
          transitionVideo.addEventListener('error', finishWait, { once: true });
        });

        experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
        experience.classList.add('is-transitioning');

        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        canvasOpacity = 1;
        transitionActive = true;

        try {
          await transitionVideo.play();
        } catch (_) {}

        // Window swallows the screen
        await animateValue(v => { expansion = v; }, 1100);

        // Await video ended (with fallback safety timer)
        await new Promise(resolve => {
          if (transitionVideo.ended) return resolve();
          let done = false;
          const onEnd = () => {
            if (!done) {
              done = true;
              transitionVideo.removeEventListener('ended', onEnd);
              transitionVideo.removeEventListener('error', onEnd);
              clearTimeout(safetyTimer);
              resolve();
            }
          };
          const maxDur = (transitionVideo.duration && !isNaN(transitionVideo.duration))
            ? Math.max(500, ((transitionVideo.duration - transitionVideo.currentTime) / 1.3) * 1000 + 500)
            : 4000;
          const safetyTimer = setTimeout(onEnd, maxDur);
          transitionVideo.addEventListener('ended', onEnd, { once: true });
          transitionVideo.addEventListener('error', onEnd, { once: true });
        });

        // Freeze final frame into #scene-canvas
        hasFrozenScene = true;
        sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        drawCover(transitionVideo, sceneCtx);

        // Commit to new state
        current = next;
        experience.classList.add('is-committing');
        render();

        // Await two rAFs
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        transitionActive = false;
        hasFrozenScene = false;
        expansion = 0;
        maskScale = 0;
        canvasOpacity = 1;

        experience.classList.remove('is-transitioning', 'is-committing');

        const maskReveal = revealMask();
        setTimeout(() => {
          revealPlanetContent();
        }, 100);
        await maskReveal;

        setTimeout(() => {
          transitionVideo.removeAttribute('src');
          transitionVideo.load();
          busy = false;
        }, 450);

      } catch (err) {
        transitionActive = false;
        hasFrozenScene = false;
        expansion = 0;
        maskScale = 1;
        canvasOpacity = 1;
        experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
        busy = false;
      }
    }

    portalBtn.addEventListener('click', travel);

    // 9. CUSTOM CURSOR
    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorVisible = false;

    window.addEventListener('pointermove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!cursorVisible) {
        cursorVisible = true;
        customCursor.classList.add('is-visible');
      }
      if (!busy) {
        targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
        targetX = (e.clientY / window.innerHeight - 0.5) * -33;
      }
    });

    document.addEventListener('mouseleave', () => {
      targetX = 0;
      targetY = 0;
      cursorVisible = false;
      customCursor.classList.remove('is-visible');
    });

    portalBtn.addEventListener('pointerenter', () => {
      customCursor.classList.add('is-enter');
    });
    portalBtn.addEventListener('pointerleave', () => {
      customCursor.classList.remove('is-enter');
    });

    function cursorLoop() {
      cursorX += (mouseX - cursorX) * 0.2;
      cursorY += (mouseY - cursorY) * 0.2;
      customCursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
      requestAnimationFrame(cursorLoop);
    }

    // 6. PRELOADER & START EXPERIENCE
    function waitForPortalMedia() {
      const state = states[current];
      if (state.image) {
        if (portalImage.complete && portalImage.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
          portalImage.addEventListener('load', resolve, { once: true });
          portalImage.addEventListener('error', resolve, { once: true });
          setTimeout(resolve, 1800);
        });
      } else {
        if (portalVideo.readyState >= 2) return Promise.resolve();
        return new Promise(resolve => {
          portalVideo.addEventListener('loadeddata', resolve, { once: true });
          portalVideo.addEventListener('canplay', resolve, { once: true });
          portalVideo.addEventListener('error', resolve, { once: true });
          setTimeout(resolve, 1800);
        });
      }
    }

    async function startExperience() {
      const bgVideo = document.getElementById(states[current].background);
      if (bgVideo) {
        bgVideo.loop = true;
        bgVideo.play().catch(() => {});
      }
      if (!states[current].image && portalVideo) {
        portalVideo.loop = true;
        portalVideo.play().catch(() => {});
      }

      await waitForPortalMedia();
      await revealMask();
      document.body.classList.add('intro-ready');
      setTimeout(() => {
        revealPlanetContent();
        busy = false;
      }, 850);
    }

    function runPreloader() {
      let finished = false;

      function finish() {
        if (finished) return;
        finished = true;
        preloaderValue.textContent = '100';
        preloaderCount.classList.add('is-leaving');
        floatingLogo.classList.add('is-docked');
        preloaderEl.classList.add('is-background');
        document.body.classList.add('preload-complete');
        startExperience();
        setTimeout(() => {
          preloaderCount.remove();
        }, 750);
        setTimeout(() => {
          floatingLogo.classList.add('is-settled');
        }, 2000);
      }

      function tickCounter() {
        if (finished) return;
        if (preloaderVideo.duration && !isNaN(preloaderVideo.duration) && preloaderVideo.duration > 0) {
          const val = Math.min(100, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
          preloaderValue.textContent = String(val);
        }
        requestAnimationFrame(tickCounter);
      }

      function startPreloaderVideo() {
        if (finished) return;
        if (preloaderVideo.duration && !isNaN(preloaderVideo.duration) && isFinite(preloaderVideo.duration)) {
          preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
        }
        const p = preloaderVideo.play();
        if (p && p.catch) {
          p.catch(() => finish());
        }
        requestAnimationFrame(tickCounter);
      }

      preloaderVideo.addEventListener('ended', finish, { once: true });
      preloaderVideo.addEventListener('error', finish, { once: true });

      if (preloaderVideo.readyState >= 1) {
        startPreloaderVideo();
      } else {
        preloaderVideo.addEventListener('loadedmetadata', startPreloaderVideo, { once: true });
      }

      // Safety fallback in case media loading hangs
      setTimeout(() => {
        if (!finished && (preloaderVideo.paused || preloaderVideo.currentTime === 0)) {
          finish();
        }
      }, 5000);
    }

    // 12. BOOT ORDER
    document.querySelectorAll('.background').forEach(v => {
      v.pause();
      v.currentTime = 0;
    });
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    render();
    requestAnimationFrame(draw);
    requestAnimationFrame(cursorLoop);
    runPreloader();
  </script>
</body>
</html>
